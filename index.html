<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bengaluru Flat Finder</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
body { display: flex; background: #0b0e13; color: #e8eaed; }
#panel { width: 360px; min-width: 360px; height: 100vh; overflow-y: auto; background: #11151c; border-right: 1px solid #232a35; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
h1 { font-size: 19px; letter-spacing: .2px; }
.sub { color: #9aa4b2; font-size: 12.5px; margin-top: 3px; }
.field label { font-size: 12px; color: #9aa4b2; display: block; margin-bottom: 5px; }
input[type=text], input[type=number] { width: 100%; background: #0b0e13; border: 1px solid #2a3342; border-radius: 8px; color: #e8eaed; padding: 9px 11px; font-size: 13.5px; outline: none; }
input:focus { border-color: #4f7cff; }
.row { display: flex; gap: 8px; align-items: center; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.toggle { display: flex; background: #0b0e13; border: 1px solid #2a3342; border-radius: 8px; overflow: hidden; flex: 1; }
.toggle button { flex: 1; padding: 8px 0; background: transparent; border: 0; color: #9aa4b2; font-size: 13.5px; cursor: pointer; }
.toggle button.on { background: #4f7cff; color: #fff; font-weight: 600; }
input[type=range] { width: 100%; accent-color: #4f7cff; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { padding: 5px 11px; border-radius: 999px; border: 1px solid #2a3342; background: #0b0e13; color: #9aa4b2; font-size: 12.5px; cursor: pointer; user-select: none; }
.chip.on { background: #1d2a4d; border-color: #4f7cff; color: #cfe0ff; }
#download, #reset { padding: 9px 12px; border-radius: 8px; border: 1px solid #2a3342; background: #4f7cff; border-color: #4f7cff; color: #fff; font-size: 13px; cursor: pointer; flex: 1; }
#reset.ghost { background: transparent; color: #9aa4b2; flex: 0 0 auto; }
#list { list-style: none; display: flex; flex-direction: column; gap: 6px; }
#list li { padding: 10px 12px; background: #0b0e13; border: 1px solid #232a35; border-radius: 10px; cursor: pointer; }
#list li:hover { border-color: #4f7cff; }
#list .n { font-size: 13.5px; font-weight: 600; }
#list .m { font-size: 12px; color: #9aa4b2; margin-top: 2px; }
#list .p { font-size: 12.5px; color: #7fd18b; margin-top: 3px; }
footer { font-size: 11px; color: #6b7482; line-height: 1.5; margin-top: 4px; }
#map { flex: 1; height: 100vh; }
.leaflet-container { background: #0b0e13; }
#card { position: absolute; right: 16px; top: 16px; z-index: 1000; width: 330px; max-height: calc(100vh - 32px); overflow-y: auto; background: #11151c; border: 1px solid #2a3342; border-radius: 14px; padding: 16px; box-shadow: 0 12px 40px rgba(0,0,0,.5); }
#card.hidden { display: none; }
#card h2 { font-size: 16.5px; }
#card .loc { color: #9aa4b2; font-size: 12.5px; margin: 3px 0 10px; }
#card .close { position: absolute; top: 10px; right: 12px; background: none; border: 0; color: #9aa4b2; font-size: 18px; cursor: pointer; }
#card .kv { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
#card .kv div { background: #0b0e13; border: 1px solid #232a35; border-radius: 8px; padding: 8px; }
#card .kv b { display: block; font-size: 13.5px; margin-top: 2px; }
#card .kv span { font-size: 11px; color: #9aa4b2; }
#card .ams { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 12px; }
#card .ams span { font-size: 11.5px; background: #1a2230; border-radius: 999px; padding: 4px 9px; color: #b7c3d4; }
#card .links a { display: block; font-size: 13px; color: #8fb0ff; text-decoration: none; padding: 6px 0; border-top: 1px solid #232a35; }
#card .est { font-size: 11px; color: #6b7482; margin-bottom: 8px; }
.mk { border-radius: 50%; border: 2px solid #0b0e13; box-shadow: 0 0 0 2px rgba(255,255,255,.15); }
@media (max-width: 760px) {
  body { flex-direction: column; }
  #panel { width: 100%; min-width: 0; height: 46vh; border-right: 0; border-bottom: 1px solid #232a35; }
  #map { height: 54vh; width: 100%; }
  #card { left: 12px; right: 12px; width: auto; top: auto; bottom: 12px; max-height: 60vh; }
}

</style>
</head>
<body>
<aside id="panel">
  <header>
    <h1>Bengaluru Flat Finder</h1>
    <p class="sub">Every major society on one map. <span id="count"></span></p>
  </header>
  <div class="field">
    <input id="search" type="text" placeholder="Search area or society (e.g. Whitefield, HSR)">
  </div>
  <div class="field row">
    <div class="toggle">
      <button id="modeBuy" class="on">Buy</button><button id="modeRent">Rent</button>
    </div>
  </div>
  <div class="field">
    <label>Max budget: <b id="budgetLabel"></b></label>
    <input id="budget" type="range" min="0" max="100" value="100">
  </div>
  <div class="field">
    <label>BHK</label>
    <div id="bhkChips" class="chips"></div>
  </div>
  <div class="field row2">
    <div><label>Min home size (sqft)</label><input id="minSqft" type="number" min="0" step="50" placeholder="Any"></div>
    <div><label>Smallest room min (sqft)</label><input id="minRoom" type="number" min="0" step="10" placeholder="Any"></div>
  </div>
  <div class="field">
    <label>Amenities</label>
    <div id="amenityChips" class="chips"></div>
  </div>
  <div class="field row">
    <button id="download">Download list (CSV)</button>
    <button id="reset" class="ghost">Reset</button>
  </div>
  <ul id="list"></ul>
  <footer>Prices &amp; rents are corridor-level estimates (Q3 2026 market data) for shortlisting only - verify on the portals. Locations from OpenStreetMap.</footer>
</aside>
<main id="map"></main>
<div id="card" class="hidden"></div>

": "Central-CBD", "lat": 12.988708, "lng": 77.595516, "configs": ["3 BHK", "4 BHK"], "sqftMin": 1800, "sqftMax": 2600, "minRoom": 120, "buyMinL": 306, "buyMaxL": 442, "rentMin": 75000, "rentMax": 110000, "amenities": ["24x7 Security", "Badminton Court", "Clubhouse", "Gym", "Kids Play Area", "Power Backup", "Spa", "Squash Court", "Swimming Pool", "Tennis Court"], "rating": 4.2, "tier": "premium", "osm": "Prestige Kenilworth"}, {"id": 99, "name": "Prestige Leela Residences", "builder": "Prestige", "locality": "HAL Old Airport Road", "corridor": "Indiranagar", "lat": 12.9604, "lng": 77.647494, "configs": ["3 BHK", "4 BHK"], "sqftMin": 1800, "sqftMax": 2600, "minRoom": 120, "buyMinL": 297, "buyMaxL": 429, "rentMin": 72000, "rentMax": 105500, "amenities": ["24x7 Security", "Badminton Court", "Clubhouse", "Gym", "Kids Play Area", "Power Backup", "Spa", "Squash Court", "Swimming Pool", "Tennis Court"], "rating": 4.0, "tier": "premium", "osm": "Prestige Leela Residences"}, {"id": 100, "name": "Embassy Grove", "builder": "Embassy", "locality": "Kodihalli", "corridor": "Indiranagar", "lat": 12.955187, "lng": 77.647679, "configs": ["3 BHK", "4 BHK"], "sqftMin": 1800, "sqftMax": 2600, "minRoom": 120, "buyMinL": 297, "buyMaxL": 429, "rentMin": 72000, "rentMax": 105500, "amenities": ["24x7 Security", "Badminton Court", "Clubhouse", "Gym", "Kids Play Area", "Power Backup", "Spa", "Squash Court", "Swimming Pool", "Tennis Court"], "rating": 4.3, "tier": "premium", "osm": "Embassy Grove"}];

</script>
<script>
const S = window.SOCIETIES;
const BHK_TYPES = ["1 BHK", "2 BHK", "3 BHK", "4 BHK"];
const AMENITIES = ["Gym", "Swimming Pool", "Tennis Court", "Clubhouse", "Kids Play Area", "Badminton Court", "Squash Court", "Spa", "Golf Course", "Power Backup"];
const BUY_RANGE = [40, 600];   // lakh
const RENT_RANGE = [15000, 150000]; // per month

const state = {
  mode: "buy", budget: BUY_RANGE[1], bhks: new Set(), amenities: new Set(),
  minSqft: 0, minRoom: 0, q: "", filtered: S.slice(),
};

const map = L.map("map", { zoomControl: true }).setView([12.9716, 77.64], 11);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  attribution: '&copy; OpenStreetMap contributors', maxZoom: 19,
}).addTo(map);

const markers = new Map();
const TIER_COLOR = { premium: "#f5c542", township: "#4fc38a", standard: "#4f7cff" };
function makeMarker(s) {
  const m = L.circleMarker([s.lat, s.lng], {
    radius: 7, color: "#0b0e13", weight: 2,
    fillColor: TIER_COLOR[s.tier] || "#4f7cff", fillOpacity: 0.95,
  });
  m.on("click", () => openCard(s));
  return m;
}
S.forEach(s => markers.set(s.id, makeMarker(s)));

function priceLabel(s) {
  return state.mode === "buy" ? "₹" + s.buyMinL + "L – ₹" + s.buyMaxL + "L"
       : "₹" + (s.rentMin/1000) + "k – ₹" + (s.rentMax/1000) + "k/mo";
}
function matches(s) {
  if (state.bhks.size && !s.configs.some(c => state.bhks.has(c))) return false;
  if (state.amenities.size && ![...state.amenities].every(a => s.amenities.includes(a))) return false;
  if (state.minSqft && s.sqftMin < state.minSqft) return false;
  if (state.minRoom && s.minRoom < state.minRoom) return false;
  if (state.mode === "buy") { if (s.buyMinL > state.budget) return false; }
  else { if (s.rentMin > state.budget) return false; }
  if (state.q) {
    const q = state.q.toLowerCase();
    if (!((s.name + " " + s.locality + " " + s.corridor + " " + s.builder).toLowerCase().includes(q))) return false;
  }
  return true;
}

const listEl = document.getElementById("list");
const countEl = document.getElementById("count");
function refresh() {
  state.filtered = S.filter(matches);
  countEl.textContent = state.filtered.length + " societies match";
  markers.forEach((m, id) => {
    const on = state.filtered.some(s => s.id === id);
    if (on && !map.hasLayer(m)) m.addTo(map);
    if (!on && map.hasLayer(m)) map.removeLayer(m);
  });
  listEl.innerHTML = "";
  state.filtered.slice(0, 200).forEach(s => {
    const li = document.createElement("li");
    li.innerHTML = '<div class="n">' + s.name + '</div><div class="m">' + s.builder + " · " + s.locality + " · " + s.configs.join("/") + '</div><div class="p">' + priceLabel(s) + '</div>';
    li.onclick = () => { map.flyTo([s.lat, s.lng], 15, { duration: 0.8 }); openCard(s); };
    listEl.appendChild(li);
  });
}

function openCard(s) {
  const c = document.getElementById("card");
  const gmaps = "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(s.name + " " + s.locality + " Bengaluru");
  const q99 = "https://www.99acres.com/search/property/buy/residential-all/bangalore-all?keyword=" + encodeURIComponent(s.name);
  const qmb = "https://www.magicbricks.com/property-for-sale-rent-in-Bangalore/residential-real-estate-Bangalore?proptype=Multistorey-Apartment,Builder-Floor-Apartment,Penthouse,Studio-Apartment&cityName=Bangalore&Bhk=&searchType=1&mbTrackSrc=homePage&tab=1&keyword=" + encodeURIComponent(s.name);
  const qnb = "https://www.nobroker.in/property/sale/bangalore/" + encodeURIComponent(s.name.replace(/\s+/g, "_"));
  c.innerHTML =
    '<button class="close" onclick="document.getElementById(\'card\').classList.add(\'hidden\')">&times;</button>' +
    "<h2>" + s.name + "</h2><div class='loc'>" + s.builder + " · " + s.locality + " (" + s.corridor + ") · Rating " + s.rating + "/5 (indicative)</div>" +
    "<div class='kv'>" +
    "<div><span>Configs</span><b>" + s.configs.join(", ") + "</b></div>" +
    "<div><span>Sizes</span><b>" + s.sqftMin + "–" + s.sqftMax + " sqft</b></div>" +
    "<div><span>Buy (est.)</span><b>₹" + s.buyMinL + "L – ₹" + s.buyMaxL + "L</b></div>" +
    "<div><span>Rent (est.)</span><b>₹" + s.rentMin.toLocaleString("en-IN") + " – ₹" + s.rentMax.toLocaleString("en-IN") + "/mo</b></div>" +
    "<div><span>Smallest room</span><b>~" + s.minRoom + " sqft</b></div>" +
    "<div><span>Type</span><b>" + s.tier + "</b></div></div>" +
    "<div class='est'>Price & rent are corridor-level estimates for shortlisting. Verify live listings on the portals below.</div>" +
    "<div class='ams'>" + s.amenities.map(a => "<span>" + a + "</span>").join("") + "</div>" +
    "<div class='links'>" +
    '<a href="' + gmaps + '" target="_blank">Open in Google Maps</a>' +
    '<a href="' + q99 + '" target="_blank">Listings on 99acres</a>' +
    '<a href="' + qmb + '" target="_blank">Listings on MagicBricks</a>' +
    '<a href="' + qnb + '" target="_blank">Listings on NoBroker</a></div>';
  c.classList.remove("hidden");
}

// --- controls ---
const searchEl = document.getElementById("search");
searchEl.addEventListener("input", () => {
  state.q = searchEl.value.trim();
  refresh();
  if (state.q && state.filtered.length) {
    const b = L.latLngBounds(state.filtered.map(s => [s.lat, s.lng]));
    map.flyToBounds(b.pad(0.2), { duration: 0.6 });
  }
});

const budgetEl = document.getElementById("budget");
const budgetLabel = document.getElementById("budgetLabel");
function setBudgetUI() {
  const [lo, hi] = state.mode === "buy" ? BUY_RANGE : RENT_RANGE;
  const v = lo + (hi - lo) * (budgetEl.value / 100);
  state.budget = Math.round(v);
  budgetLabel.textContent = state.mode === "buy"
    ? "₹" + state.budget + "L" : "₹" + state.budget.toLocaleString("en-IN") + "/mo";
}
budgetEl.addEventListener("input", () => { setBudgetUI(); refresh(); });

function setMode(mode) {
  state.mode = mode;
  document.getElementById("modeBuy").classList.toggle("on", mode === "buy");
  document.getElementById("modeRent").classList.toggle("on", mode === "rent");
  setBudgetUI(); refresh();
}
document.getElementById("modeBuy").onclick = () => setMode("buy");
document.getElementById("modeRent").onclick = () => setMode("rent");

function chips(el, items, set, cb) {
  const box = document.getElementById(el);
  items.forEach(t => {
    const c = document.createElement("span");
    c.className = "chip"; c.textContent = t;
    c.onclick = () => { set.has(t) ? set.delete(t) : set.add(t); c.classList.toggle("on"); cb(); };
    box.appendChild(c);
  });
}
chips("bhkChips", BHK_TYPES, state.bhks, refresh);
chips("amenityChips", AMENITIES, state.amenities, refresh);

document.getElementById("minSqft").addEventListener("input", e => { state.minSqft = +e.target.value || 0; refresh(); });
document.getElementById("minRoom").addEventListener("input", e => { state.minRoom = +e.target.value || 0; refresh(); });

document.getElementById("reset").onclick = () => {
  state.bhks.clear(); state.amenities.clear(); state.minSqft = 0; state.minRoom = 0; state.q = "";
  document.querySelectorAll(".chip.on").forEach(c => c.classList.remove("on"));
  searchEl.value = ""; document.getElementById("minSqft").value = ""; document.getElementById("minRoom").value = "";
  budgetEl.value = 100; setBudgetUI(); refresh(); map.flyTo([12.9716, 77.64], 11, { duration: 0.6 });
};

document.getElementById("download").onclick = () => {
  const rows = [["Name","Builder","Locality","Corridor","Configs","SqftMin","SqftMax","BuyMinLakh","BuyMaxLakh","RentMin","RentMax","Rating","Amenities","Latitude","Longitude"]];
  state.filtered.forEach(s => rows.push([s.name, s.builder, s.locality, s.corridor, s.configs.join("/"), s.sqftMin, s.sqftMax, s.buyMinL, s.buyMaxL, s.rentMin, s.rentMax, s.rating, s.amenities.join("; "), s.lat, s.lng]));
  const csv = rows.map(r => r.map(x => '"' + String(x).replace(/"/g, '""') + '"').join(",")).join("\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv" }));
  a.download = "bengaluru-flat-finder-list.csv"; a.click();
};

setBudgetUI(); refresh();

</script>
