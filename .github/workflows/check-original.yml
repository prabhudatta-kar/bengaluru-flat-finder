name: Build Bengaluru from original Flat Finder source
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/check-original.yml
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout destination
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout source and Bengaluru pipeline output
        uses: actions/checkout@v4
        with:
          repository: aryabharat/flat-finder
          path: imported-source
          persist-credentials: false
      - name: Preserve source and provenance
        run: |
          rm -rf imported-source/.git imported-source/.github
          cp -R imported-source/. .
          rm -rf imported-source
          python3 - <<'PY'
          from pathlib import Path
          import json
          p=Path('web/public/data/cities.json')
          p.write_text(json.dumps({'bangalore': {'name':'Bengaluru'}}))
          index=Path('web/index.html')
          s=index.read_text()
          notice='<div style="position:fixed;bottom:0;left:0;right:0;z-index:10000;background:#332810;color:#ffe3a1;padding:8px 16px;font:12px/1.5 sans-serif">Adapted from <a style="color:#fff" href="https://github.com/kairothq/flat-finder">Divy Kairoth\'s Flat Finder</a>, with <a style="color:#fff" href="https://github.com/aryabharat/flat-finder">aryabharat\'s Bengaluru dataset</a>. Snapshot, not live inventory. 0 hand-verified bedroom plans. Prices may be estimated; unknown rooms are not verified matches.</div>'
          s=s.replace('</body>',notice+'</body>')
          index.write_text(s)
          Path('ATTRIBUTION.md').write_text('Original app: kairothq/flat-finder by Divy Kairoth. Bengaluru adaptation and dataset: aryabharat/flat-finder. Both package.json files declare MIT. The upstream repositories have no standalone LICENSE file. Retained original sources and authorship links. Map data: OpenStreetMap contributors, ODbL. Property data: Magicbricks, subject to its rights. This adaptation does not claim ownership of third-party data.\n')
          Path('README.md').write_text('# Bengaluru Flat Finder\n\nBuilt from the original Flat Finder app by Divy Kairoth (https://github.com/kairothq/flat-finder), using the Bengaluru adaptation and pipeline output from https://github.com/aryabharat/flat-finder. Source code is preserved here. This replaces an earlier from-scratch prototype with guessed project attributes; do not rely on its old CSV downloads.\n\n## Data caveats\n\nThis is a third-party snapshot, not a fresh crawl or live inventory. Dataset-reported totals: 14,200 projects listed, 13,566 societies on map, 46,443 sale listings and 12,425 rental listings. These counts are not independently audited. Bedroom plans: 0 hand-verified rows; unknown dimensions must remain unknown. Portal facts, listing-based medians and modeled prices have different confidence levels. Verify listings, prices, amenities and dimensions at their cited sources before deciding. The dataset covers part, not all, of the city-wide portal directory.\n\n## Source and run\n\nThe app is in web/, the data pipeline in pipeline/, and CLI in cli/. Run npm ci then npm run dev inside web/. This repository also contains the compiled site at its root for GitHub Pages. Read ATTRIBUTION.md for authorship and license notes. No paid services are used by this build. The Claude MCP function is preserved as source but is not served by GitHub Pages.\n')
          PY
      - name: Test and build original app
        run: |
          python3 -m pip install pytest
          python3 -m pytest pipeline -q
          cd web
          npm ci --ignore-scripts
          npx vitest run --root .. cli web/src
          npm run build -- --base=/bengaluru-flat-finder/
      - name: Publish compiled site and preserved source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp -R web/dist/. .
          rm -rf web/dist web/node_modules
          touch .nojekyll
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m 'Build original Flat Finder with sourced Bengaluru snapshot and attribution'
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" push origin HEAD:main
